<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KL 分账核对站</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #667085;
        --line: #dde3ea;
        --blue: #1f5eff;
        --green: #0f8f67;
        --amber: #b86b00;
        --red: #c2410c;
        --shadow: 0 10px 30px rgba(22, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: static;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .topbar-inner,
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar-inner {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 2.4vw, 28px);
        letter-spacing: 0;
      }

      .subtle {
        margin-top: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: none;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        min-height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: #b9c5d2;
        background: #f9fafb;
      }

      main {
        padding: 12px 0 40px;
      }

      .summary-grid {
        position: sticky;
        top: 0;
        z-index: 18;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 0;
        margin-bottom: 8px;
        padding: 6px 0;
        background: rgba(246, 247, 249, 0.94);
        backdrop-filter: blur(10px);
      }

      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        box-shadow: var(--shadow);
      }

      .metric .label {
        color: var(--muted);
        font-size: 12px;
      }

      .metric .value {
        margin-top: 2px;
        font-size: clamp(20px, 2.4vw, 28px);
        font-weight: 750;
        line-height: 1.05;
      }

      .metric.cici .value {
        color: var(--blue);
      }

      .metric.yifan .value {
        color: var(--green);
      }

      .metric.transfer .value {
        color: var(--amber);
      }

      .metric.total .value {
        color: var(--red);
      }

      .filters {
        display: none;
        margin-top: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px;
        grid-template-columns: 1.2fr repeat(3, minmax(140px, 0.55fr));
        gap: 8px;
        align-items: center;
      }

      .workflow {
        margin-top: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
      }

      .workflow-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        min-width: 0;
        display: grid;
        grid-template-rows: 48px 1fr;
      }

      .workflow-body {
        padding: 8px;
        display: grid;
      }

      .upload-zone {
        min-height: 86px;
        border: 1px dashed #a8b4c2;
        border-radius: 8px;
        background: #fafbfc;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 12px;
        cursor: pointer;
      }

      .upload-zone.dragging {
        border-color: var(--blue);
        background: #edf3ff;
      }

      .upload-zone strong {
        display: block;
        font-size: 15px;
      }

      .upload-zone span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .ocr-hint {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .ocr-hint.warning {
        color: #9a3412;
      }

      .hidden-input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .pending-list {
        display: grid;
        gap: 12px;
      }

      .pending-empty {
        color: var(--muted);
        padding: 8px;
        min-height: 86px;
        display: grid;
        place-items: center;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #fafbfc;
      }

      .pending-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .pending-card.scanning {
        opacity: 0.78;
      }

      .pending-main {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }

      .pending-preview {
        width: 100%;
        aspect-ratio: 3 / 4;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
        background: #f2f4f7;
        cursor: pointer;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .form-grid .wide {
        grid-column: 1 / -1;
      }

      .split-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .split-options label {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        background: #fff;
      }

      .split-options input {
        width: auto;
        min-height: auto;
      }

      .pending-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: #fafbfc;
      }

      .pending-actions .note {
        margin: 0 auto 0 0;
      }

      .btn.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .btn.danger {
        color: #9a3412;
      }

      .workflow .btn.danger {
        min-height: 34px;
        padding: 0 10px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 40;
        max-width: min(360px, calc(100% - 36px));
        padding: 12px 14px;
        border-radius: 8px;
        background: #17202a;
        color: #fff;
        box-shadow: var(--shadow);
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: 0.18s ease;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      .field {
        display: grid;
        gap: 3px;
      }

      label {
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
      }

      .content {
        margin-top: 10px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0;
      }

      .count {
        color: var(--muted);
        white-space: nowrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 12px;
        color: var(--muted);
        background: #fafbfc;
        position: sticky;
        top: 65px;
        z-index: 5;
      }

      td.money,
      th.money {
        text-align: right;
        white-space: nowrap;
      }

      .date {
        white-space: nowrap;
        color: #344054;
      }

      .item-name {
        font-weight: 650;
      }

      .note {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #eef2ff;
        color: #243b87;
        white-space: nowrap;
      }

      .pill.transfer {
        background: #fff4e5;
        color: #8a4b00;
      }

      .shot-button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        min-height: 32px;
        padding: 0 10px;
        cursor: pointer;
        white-space: nowrap;
      }

      .shot-button:hover {
        border-color: #b9c5d2;
        background: #f9fafb;
      }

      .table-wrap {
        display: none;
      }

      .mobile-list {
        display: grid;
        gap: 4px;
        padding: 6px;
        background: #f6f7f9;
      }

      .entry-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        display: grid;
        gap: 4px;
      }

      .entry-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }

      .entry-title {
        min-width: 0;
      }

      .entry-title-line {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .entry-title-line .date {
        font-size: 11px;
        color: var(--muted);
      }

      .entry-title-line .item-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .entry-money {
        text-align: right;
        white-space: nowrap;
        font-weight: 750;
        font-size: 13px;
      }

      .entry-subline {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .entry-meta {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      .entry-due {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: #f3f5f7;
        color: #344054;
        font-size: 11px;
        white-space: nowrap;
      }

      .entry-meta .shot-button {
        min-height: 22px;
        padding: 0 7px;
        font-size: 11px;
      }

      .entry-meta .entry-delete {
        margin-left: auto;
        border-color: #f3c7bb;
        color: #9a3412;
        background: #fffaf8;
      }

      .entry-meta .entry-delete:hover {
        border-color: #df9b87;
        background: #fff3ed;
      }

      .side {
        display: grid;
        gap: 14px;
      }

      .side-section {
        padding: 16px;
      }

      .side-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .side-row:last-child {
        border-bottom: 0;
      }

      .side-row strong {
        white-space: nowrap;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .thumb {
        display: grid;
        gap: 6px;
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }

      .thumb img {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f2f4f7;
      }

      .thumb span {
        font-size: 12px;
        color: var(--muted);
        min-height: 34px;
      }

      dialog {
        width: min(940px, calc(100% - 24px));
        border: 0;
        border-radius: 8px;
        padding: 0;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      dialog::backdrop {
        background: rgba(8, 15, 26, 0.72);
      }

      .modal-head {
        min-height: 54px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-title {
        font-weight: 700;
      }

      .modal-body {
        padding: 12px;
        background: #111827;
      }

      .modal-body img {
        width: 100%;
        max-height: 78vh;
        object-fit: contain;
        display: block;
        background: #111827;
      }

      .empty {
        display: none;
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }

      .empty.show {
        display: block;
      }

      @media (max-width: 960px) {
        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .workflow {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .filters {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .content {
          grid-template-columns: 1fr;
        }

        th {
          top: 64px;
        }
      }

      @media (max-width: 680px) {
        body {
          font-size: 14px;
          background: #f2f4f7;
        }

        .topbar-inner,
        main {
          width: min(100% - 16px, 1180px);
        }

        .topbar-inner {
          align-items: flex-start;
          min-height: 0;
          padding: 8px 0;
          flex-direction: column;
          gap: 7px;
        }

        h1 {
          font-size: 20px;
        }

        .subtle {
          font-size: 12px;
          line-height: 1.35;
        }

        .actions {
          width: 100%;
          justify-content: stretch;
          gap: 6px;
        }

        .actions .btn {
          flex: 1 1 0;
          min-width: 0;
          min-height: 38px;
          padding: 0 8px;
          font-size: 13px;
        }

        main {
          padding: 8px 0 24px;
        }

        .workflow {
          margin-top: 0;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }

        .workflow-panel,
        .panel,
        .metric {
          border-radius: 8px;
          box-shadow: none;
        }

        .panel-head {
          padding: 9px 10px;
        }

        .workflow .panel-head {
          gap: 6px;
        }

        .workflow .panel-head h2 {
          font-size: 14px;
        }

        .workflow .count {
          font-size: 11px;
        }

        .workflow-panel {
          grid-template-rows: 42px 1fr;
        }

        .workflow-body {
          padding: 6px;
        }

        .upload-zone {
          min-height: 68px;
          padding: 6px;
        }

        .upload-zone strong {
          font-size: 13px;
        }

        .upload-zone span {
          font-size: 10px;
          line-height: 1.25;
        }

        .pending-empty {
          min-height: 68px;
          padding: 6px;
          font-size: 11px;
        }

        .workflow .btn.danger {
          min-height: 30px;
          padding: 0 8px;
          font-size: 12px;
        }

        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
          margin-top: 0;
          margin-bottom: 6px;
          padding: 5px 0;
        }

        .metric {
          padding: 6px 8px;
        }

        .metric .label {
          font-size: 11px;
        }

        .metric .value {
          margin-top: 2px;
          font-size: 20px;
          line-height: 1.05;
          word-break: keep-all;
        }

        .filters {
          margin-top: 8px;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 7px;
          padding: 8px;
        }

        .filters .field:first-child {
          grid-column: 1 / -1;
        }

        input,
        select,
        .btn,
        .shot-button {
          min-height: 40px;
        }

        .pending-main,
        .form-grid,
        .split-options {
          grid-template-columns: 1fr;
        }

        .pending-preview {
          max-height: 220px;
          object-fit: contain;
        }

        .pending-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
          padding: 10px;
        }

        .content {
          margin-top: 8px;
          gap: 8px;
        }

        .mobile-list {
          display: grid;
          gap: 4px;
          padding: 5px;
          background: #f2f4f7;
        }

        .entry-card {
          padding: 6px 7px;
          gap: 3px;
        }

        .entry-title-line {
          gap: 6px;
        }

        .entry-title-line .date {
          font-size: 11px;
        }

        .entry-title-line .item-name {
          font-size: 13px;
        }

        .entry-money {
          min-width: 74px;
          font-size: 13px;
        }

        .entry-subline {
          font-size: 10px;
        }

        .entry-meta {
          gap: 4px;
        }

        .entry-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .entry-grid div {
          border: 1px solid var(--line);
          border-radius: 8px;
          padding: 8px;
        }

        .entry-grid span {
          display: block;
          color: var(--muted);
          font-size: 12px;
        }

        .side {
          gap: 10px;
        }

        .side-section {
          padding: 12px;
        }

        .gallery {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
        }

        .thumb span {
          min-height: 0;
          font-size: 11px;
          line-height: 1.25;
        }

        dialog {
          width: calc(100% - 16px);
          max-height: calc(100dvh - 24px);
        }

        .modal-body img {
          max-height: 72dvh;
        }

        .toast {
          right: 8px;
          bottom: max(8px, env(safe-area-inset-bottom));
          max-width: calc(100% - 16px);
        }
      }

      @media print {
        body {
          background: #fff;
        }

        .topbar,
        .workflow,
        .filters,
        .side,
        .shot-button,
        dialog {
          display: none;
        }

        main {
          width: 100%;
          padding: 0;
        }

        .summary-grid {
          box-shadow: none;
        }

        .content {
          display: block;
        }

        .panel {
          border: 0;
        }

        th {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div>
            <h1>KL 分账核对站</h1>
            <div class="subtle">2026-05-23 至 2026-05-27 · 金额均为 RM · 付款人：我 · 截图敏感编号已打码</div>
          </div>
          <div class="actions">
            <button class="btn" type="button" id="resetBtn" hidden>重置筛选</button>
            <button class="btn" type="button" id="exportBtn">导出 JSON</button>
            <button class="btn" type="button" onclick="window.print()">打印/保存 PDF</button>
          </div>
        </div>
      </header>

      <main>
        <section class="summary-grid" aria-label="汇总">
          <div class="metric cici">
            <div class="label">cici 应还你</div>
            <div class="value" id="ciciTotal">RM104.50</div>
          </div>
          <div class="metric yifan">
            <div class="label">yifan 应还你</div>
            <div class="value" id="yifanTotal">RM550.08</div>
          </div>
        </section>

        <section class="workflow" aria-label="入账工作流">
          <div class="workflow-panel">
            <div class="panel-head">
              <h2>截图入账</h2>
              <span class="count" id="draftCount">0 张待确认</span>
            </div>
            <div class="workflow-body">
              <button class="upload-zone" type="button" id="uploadZone">
                <span>
                  <strong>上传或粘贴支付截图</strong>
                  <span>自动识别日期、项目、金额和分摊</span>
                </span>
              </button>
              <div class="ocr-hint" id="ocrHint"></div>
              <input class="hidden-input" id="receiptInput" type="file" accept="image/*" multiple />
            </div>
          </div>

          <div class="workflow-panel">
            <div class="panel-head">
              <h2>待确认</h2>
              <button class="btn danger" type="button" id="clearDraftsBtn">清空</button>
            </div>
            <div class="workflow-body">
              <div class="pending-list" id="pendingList"></div>
            </div>
          </div>
        </section>

        <section class="filters" aria-label="筛选">
          <div class="field">
            <label for="searchInput">搜索项目</label>
            <input id="searchInput" type="search" placeholder="例如 TGV、Grab、BusOnlineTicket" />

      function guessFromName(fileName) {
        const base = fileName.replace(/\.[^.]+$/, "");
        const dateMatch = base.match(/(20\d{2})[-_./ ]?(\d{1,2})[-_./ ]?(\d{1,2})/);
        const date = dateMatch
          ? `${dateMatch[1]}-${dateMatch[2].padStart(2, "0")}-${dateMatch[3].padStart(2, "0")}`
          : todayIso();
        const item = base
          .replace(/20\d{2}[-_./ ]?\d{1,2}[-_./ ]?\d{1,2}/, "")
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        return { date, item: item || "待确认项目" };
      }

      function normalizeText(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function parseAmountFromText(text) {
        const candidates = [];
        String(text || "")
          .split(/\n+/)
          .forEach((line) => {
            const lower = line.toLowerCase();
            const isFinalTotal = /\b(grand|net|n\.?)?\s*total\b|amount\s*paid|balance\s*due/.test(lower);
            const isIntermediate = /subtotal|sub\s*total|tax|taxable|service\s*charge|charge@|rounding|summary/.test(lower);
            const hasMoneyHint = /\brm\b|\bmyr\b|total|amount|paid|grand|balance/.test(lower);
            const nums = [...line.matchAll(/(?:rm|myr)?\s*([0-9]{1,4}(?:[.,][0-9]{1,2})?)/gi)]
              .map((match) => Number(match[1].replace(",", ".")))
              .filter((value) => value > 0 && value < 5000);
            nums.forEach((value) => {
              candidates.push({
                value,
                score: (isFinalTotal ? 8 : 0) + (hasMoneyHint ? 2 : 0) - (isIntermediate ? 5 : 0),
              });
            });
          });
        if (!candidates.length) return 0;
        candidates.sort((a, b) => b.score - a.score || b.value - a.value);
        return candidates[0].value;
      }

      function parseDateFromText(fileName, text) {
        const nameYmd = fileName.match(/(20\d{2})[-/._ ]?(\d{1,2})[-/._ ]?(\d{1,2})/);
        if (nameYmd) return `${nameYmd[1]}-${nameYmd[2].padStart(2, "0")}-${nameYmd[3].padStart(2, "0")}`;
        const dmy = String(text || "").match(/(\d{1,2})[-/](\d{1,2})[-/](20\d{2})/);
        if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, "0")}-${dmy[1].padStart(2, "0")}`;
        const ymd = String(text || "").match(/(20\d{2})[-/._ ](\d{1,2})[-/._ ](\d{1,2})/);
        if (ymd) return `${ymd[1]}-${ymd[2].padStart(2, "0")}-${ymd[3].padStart(2, "0")}`;
        return "";
      }

      function parseItemFromText(fileName, text) {
        const known = analyzeFromKnownReceipts(fileName, text);
        if (known) return known.item;
        const firstUseful = String(text || "")
          .split(/\n+/)
          .map((line) => line.trim())
          .find((line) => {
            const ascii = line.replace(/[^\x20-\x7e]/g, "");
            const letters = (line.match(/[A-Za-z]/g) || []).length;
            const symbols = (line.match(/[《》“”~#$%^*=|\\[\]{}<>]/g) || []).length;
            const readableRatio = ascii.length / Math.max(line.length, 1);
            return (
              /[A-Za-z]{3,}/.test(line) &&
              readableRatio > 0.55 &&
              letters / Math.max(line.length, 1) > 0.35 &&
              symbols / Math.max(line.length, 1) < 0.22 &&
              !/\d{4}|receipt|invoice|transaction|subtotal|total|tax|table|cover|tel|floor|preferred|guest|order|thank/i.test(
                line
              )
            );
          });
        return firstUseful ? firstUseful.slice(0, 80) : "";
      }

      function analyzeFromKnownReceipts(fileName, text = "") {
        const normalized = normalizeText(`${fileName} ${text}`);
        return KNOWN_RECEIPTS.find((receipt) => receipt.match.every((keyword) => normalized.includes(keyword)));
      }

      async function readTextFromImage(file) {
        if (!("TextDetector" in window) || !window.createImageBitmap) return "";
        try {
          const detector = new TextDetector();
          const bitmap = await createImageBitmap(file);
          const detections = await detector.detect(bitmap);
          return detections.map((item) => item.rawValue || "").join(" ");
        } catch {
          return "";
        }
      }

      async function analyzeWithLocalOcr(file, dataUrl) {
        if (!canUseLocalOcr()) return { ocrUnavailable: true, skippedRemotePage: true };
        for (const endpoint of OCR_ENDPOINTS) {
          let timeout = 0;
          try {
            const controller = new AbortController();
            timeout = window.setTimeout(() => controller.abort(), 26000);
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ fileName: file.name, image: dataUrl }),
              signal: controller.signal,
            });
            if (!response.ok) continue;
            setOcrHint("本机 OCR 已连接，上传后会自动填入识别结果");
            return { ...(await response.json()), ocrAvailable: true };
          } catch {
            // Try the next local OCR endpoint.
          } finally {
            window.clearTimeout(timeout);
          }
        }
        setOcrHint(`本机 OCR 未连接：请用 ${OCR_PAGE_URL} 打开本页`, true);
        return { ocrUnavailable: true };
      }

      async function analyzeWithBrowserOcr(file, dataUrl) {
        if (!canUseBrowserOcr()) {
          return {
            ocrUnavailable: true,
            browserOcrFailed: true,
            note: "OCR 组件还没加载完成，请刷新后再试",
          };
        }
        try {
          setOcrHint("正在浏览器内识别截图，首次加载会慢一些");
          const { data } = await Tesseract.recognize(dataUrl, "eng+chi_sim", {
            workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/worker.min.js",
            corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@6/tesseract-core-simd.wasm.js",
            langPath: "https://tessdata.projectnaptha.com/4.0.0",
            gzip: true,
            logger: (message) => {
              if (message.status === "recognizing text") {
                const pct = Math.round((message.progress || 0) * 100);
                setOcrHint(`正在浏览器内识别截图 ${pct}%`);
              }
            },
          });
          const text = data?.text || "";
          const known = analyzeFromKnownReceipts(file.name, text);
          setOcrHint(text ? "浏览器 OCR 已完成，识别结果已填入待确认" : "浏览器 OCR 已完成，但未读到文字");
          return {
            ...(known || {}),
            text,
            date: parseDateFromText(file.name, text),
            item: known?.item || parseItemFromText(file.name, text),
            amount: known?.amount || parseAmountFromText(text),
            type: known?.type || "共同消费",
            splitMode: known?.splitMode || "both",
            confidence: known ? "high" : text ? "medium" : "low",
            ocrAvailable: true,
            browserOcr: true,
          };
        } catch {
          setOcrHint("浏览器 OCR 加载失败，截图已进入待确认", true);
          return {
            ocrUnavailable: true,
            browserOcrFailed: true,
            note: "浏览器 OCR 加载失败，请刷新后再上传一次",
          };
        }
      }

      async function analyzeReceipt(file, dataUrl) {
        const guess = guessFromName(file.name);
        const known = analyzeFromKnownReceipts(file.name);
        const imageText = await readTextFromImage(file);
        const localOcr = await analyzeWithLocalOcr(file, dataUrl);
        const browserOcr = localOcr?.skippedRemotePage ? await analyzeWithBrowserOcr(file, dataUrl) : null;
        const bestOcr = localOcr?.ocrAvailable ? localOcr : browserOcr?.ocrAvailable ? browserOcr : null;
        const ocrReady = Boolean(bestOcr?.ocrAvailable);
        const textAmount = parseAmountFromText(imageText);
        const ocrAmount = ocrReady ? Number(bestOcr?.amount) || "" : "";
        return {
          ...guess,
          ...(ocrReady ? bestOcr : {}),
          ...(known || {}),
          date: known?.date || bestOcr?.date || guess.date,
          item: known?.item || bestOcr?.item || guess.item,
          amount: known?.amount || ocrAmount || textAmount || "",
          type: known?.type || bestOcr?.type || "共同消费",
          splitMode: known?.splitMode || bestOcr?.splitMode || "both",
          confidence: known ? "high" : ocrReady ? bestOcr.confidence || "medium" : textAmount ? "medium" : "low",
          note: browserOcr?.note || localOcr?.note || "",
          ocrUnavailable: Boolean(localOcr?.ocrUnavailable && !bestOcr),
          skippedRemotePage: Boolean(localOcr?.skippedRemotePage && !bestOcr && !browserOcr?.browserOcrFailed),
          browserOcr: Boolean(browserOcr?.ocrAvailable),
          browserOcrFailed: Boolean(browserOcr?.browserOcrFailed),
          sourceText: ocrReady ? bestOcr?.text || imageText : imageText,
        };
      }

      function createDraft(file, src, analysis) {
        const serviceNote = `未连接本地识别服务，请用 ${OCR_PAGE_URL} 打开本页后再试`;
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          fileName: file.name,
          src,
          date: analysis.date,
          item: analysis.item,
          amount: analysis.amount,
          type: analysis.type || "共同消费",
          splitMode: analysis.splitMode || "both",
          cici: 0,
          yifan: 0,
          note:
            analysis.note ||
            (analysis.status === "scanning"
              ? "正在自动识别图片..."
              : analysis.ocrUnavailable
              ? serviceNote
              : analysis.confidence === "low"
              ? "未识别到金额，请换清晰截图或文件名带金额"
              : "自动识别，待确认入账"),
          confidence: analysis.confidence,
          status: analysis.status || "ready",
        };
      }

      function readFiles(files) {
        Array.from(files)
          .filter((file) => file.type.startsWith("image/"))
          .forEach((file) => {
            const reader = new FileReader();
            reader.addEventListener("load", async () => {
              const draft = createDraft(file, reader.result, {
                ...guessFromName(file.name),
                amount: "",
                type: "共同消费",
                splitMode: "both",
                confidence: "scanning",
                status: "scanning",
              });
              updateDraftAmounts(draft);
              drafts.unshift(draft);
              renderPending();
              notify("正在识别截图");

              const analysis = await analyzeReceipt(file, reader.result);
              const liveDraft = drafts.find((item) => item.id === draft.id);
              if (!liveDraft) return;
              Object.assign(liveDraft, {
                date: analysis.date,
                item: analysis.item,
                amount: analysis.amount,
                type: analysis.type || "共同消费",
                splitMode: analysis.splitMode || "both",
                note:
                  analysis.note ||
                  (analysis.browserOcrFailed
                    ? "浏览器 OCR 未能完成，请刷新后重试"
                    : analysis.ocrUnavailable
                    ? analysis.skippedRemotePage
                      ? "线上版暂不连接本机 OCR，请确认后入账"
                      : `未连接本地识别服务，请用 ${OCR_PAGE_URL} 打开本页后再试`
                    : analysis.confidence === "low"
                    ? "未识别到金额，请换清晰截图或文件名带金额"
                    : "自动识别，待确认入账"),
                confidence: analysis.confidence,
                status: "ready",
              });
              updateDraftAmounts(liveDraft);
              renderPending();
              notify(
                analysis.browserOcrFailed
                  ? "浏览器识别失败，已加入待确认"
                  : analysis.skippedRemotePage
                  ? "已加入待确认"
                  : analysis.ocrUnavailable
                  ? "本地识别服务未连接"
                  : analysis.confidence === "low"
                  ? "已加入待确认，未识别到金额"
                  : "已自动解析截图"
              );
            });
            reader.readAsDataURL(file);
          });
      }

      function updateDraftAmounts(draft) {
        const amount = Number(draft.amount) || 0;
        if (draft.splitMode === "both") {
          draft.cici = amount / 3;
          draft.yifan = amount / 3;
        } else if (draft.splitMode === "cici") {
          draft.cici = amount / 2;
          draft.yifan = 0;
        } else if (draft.splitMode === "yifan") {
          draft.cici = 0;
          draft.yifan = amount / 2;
        } else if (draft.splitMode === "ciciFull") {
          draft.cici = amount;
          draft.yifan = 0;
        } else if (draft.splitMode === "yifanFull") {
          draft.cici = 0;
          draft.yifan = amount;
        }
      }

      function peopleForDraft(draft) {
        if (draft.splitMode === "both") return 3;
        if (draft.splitMode === "cici" || draft.splitMode === "yifan") return 2;
        if (draft.splitMode === "custom") {
          return 1 + (Number(draft.cici) > 0 ? 1 : 0) + (Number(draft.yifan) > 0 ? 1 : 0);
        }
        return 1;
      }

      function showImage(src, label) {
        dialogTitle.textContent = label;
        dialogImage.src = src;
        dialogImage.alt = label;
        imageDialog.showModal();
      }

      function shotButtons(entry) {
        return entry.shots.length
          ? entry.shots
              .map(
                (shot) =>
                  `<button class="shot-button" type="button" data-src="${escapeAttr(shot.src)}" data-label="${escapeAttr(
                    shot.label
                  )}">查看截图</button>`
              )
              .join(" ")
          : '<span class="note">聊天确认</span>';
      }

      function deleteEntryButton(entry) {
        return `<button class="shot-button entry-delete" type="button" data-action="remove-entry" data-entry-id="${escapeAttr(
          entry.id
        )}" onclick="removeEntryById(this.dataset.entryId)">删除</button>`;
      }

      function removeEntryById(id) {
        if (!id) return;
        const before = entries.length;
        deletedEntryIds.add(id);
        entries = entries.filter((entry) => entry.id !== id);
        if (entries.length === before) return;
        renderGallery();
        render();
        saveStoredEntries();
        saveDeletedEntryIds();
        notify("已删除这笔记录");
      }

      window.removeEntryById = removeEntryById;

      function renderDateOptions() {
        const selected = dateFilter.value || "all";
        const dates = [...new Set(entries.map((entry) => entry.date).filter(Boolean))].sort();
        dateFilter.innerHTML =
          '<option value="all">全部日期</option>' +
          dates.map((date) => `<option value="${date}">${date}</option>`).join("");
        dateFilter.value = dates.includes(selected) ? selected : "all";
      }

      function renderTypeOptions() {
        const selected = typeFilter.value || "all";
        const types = [...new Set(entries.map((entry) => entry.type).filter(Boolean))];
        typeFilter.innerHTML =
          '<option value="all">全部类型</option>' +
          types.map((type) => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`).join("");
        typeFilter.value = types.includes(selected) ? selected : "all";
      }

      function renderSummary() {
        const sum = (filter, field) =>
          entries.filter(filter).reduce((total, entry) => total + (Number(entry[field]) || 0), 0);
        const ciciDue = sum(() => true, "cici");
        const yifanDue = sum(() => true, "yifan");
        ciciTotal.textContent = fmt(ciciDue);
        yifanTotal.textContent = fmt(yifanDue);
        ciciSharedTotal.textContent = fmt(sum((entry) => entry.type === "共同消费", "cici"));
        yifanSharedTotal.textContent = fmt(sum((entry) => entry.type === "共同消费", "yifan"));
        yifanTransferTotal.textContent = fmt(sum((entry) => entry.type.includes("转账"), "yifan"));
        yifanClothesTotal.textContent = fmt(sum((entry) => entry.type.includes("衣服"), "yifan"));
        allDueTotal.textContent = fmt(ciciDue + yifanDue);
      }

      function matchesFilters(entry) {
        const q = searchInput.value.trim().toLowerCase();
        const dateOk = dateFilter.value === "all" || entry.date === dateFilter.value;
        const personOk =
          personFilter.value === "all" ||
          (personFilter.value === "cici" && entry.cici > 0) ||
          (personFilter.value === "yifan" && entry.yifan > 0);
        const typeOk = typeFilter.value === "all" || entry.type === typeFilter.value;
        const text = `${entry.item} ${entry.note} ${entry.type}`.toLowerCase();
        return dateOk && personOk && typeOk && (!q || text.includes(q));
      }

      function render() {
        renderDateOptions();
        renderTypeOptions();
        renderSummary();
        const visible = entries.filter(matchesFilters);
        visibleCount.textContent = `${visible.length} 笔`;
        emptyState.classList.toggle("show", visible.length === 0);

        detailBody.innerHTML = visible
          .map(
            (entry) => `
              <tr>
                <td class="date">${escapeHtml(entry.date)}</td>
                <td>
                  <div class="item-name">${escapeHtml(entry.item)}</div>
                  <div class="note">${escapeHtml(entry.note)} · 分账人数 ${entry.people}</div>
                </td>
                <td class="money">${fmt(entry.amount)}</td>
                <td class="money">${entry.cici ? fmt(entry.cici) : "-"}</td>
                <td class="money">${entry.yifan ? fmt(entry.yifan) : "-"}</td>
                <td><span class="pill ${entry.type.includes("转账") ? "transfer" : ""}">${escapeHtml(entry.type)}</span></td>
                <td>${shotButtons(entry)} ${deleteEntryButton(entry)}</td>
              </tr>
            `
          )
          .join("");

        mobileList.innerHTML = visible
          .map(
            (entry) => `
              <article class="entry-card">
                <div class="entry-top">
                  <div class="entry-title">
                    <div class="entry-title-line">
                      <span class="date">${escapeHtml(entry.date)}</span>
                      <span class="item-name">${escapeHtml(entry.item)}</span>
                    </div>
                    <div class="entry-subline">${escapeHtml(entry.note)}</div>
                  </div>
                  <div class="entry-money">${fmt(entry.amount)}</div>
                </div>
                <div class="entry-meta">
                  <span class="pill ${entry.type.includes("转账") ? "transfer" : ""}">${escapeHtml(entry.type)}</span>
                  <span class="entry-due">cici ${entry.cici ? fmt(entry.cici) : "-"}</span>
                  <span class="entry-due">yifan ${entry.yifan ? fmt(entry.yifan) : "-"}</span>
                  ${shotButtons(entry)}
                  ${deleteEntryButton(entry)}
                </div>
              </article>
            `
          )
          .join("");
      }

      function renderPending() {
        draftCount.textContent = `${drafts.length} 张待确认`;
        if (!drafts.length) {
          pendingList.innerHTML = '<div class="pending-empty">暂无待确认截图</div>';
          return;
        }

        pendingList.innerHTML = drafts
          .map(
            (draft) => `
              <article class="pending-card ${draft.status === "scanning" ? "scanning" : ""}" data-draft-id="${escapeAttr(
                draft.id
              )}">
                <div class="pending-main">
                  <img class="pending-preview" src="${escapeAttr(draft.src)}" alt="${escapeAttr(
                    draft.fileName
                  )}" data-src="${escapeAttr(draft.src)}" data-label="${escapeAttr(draft.fileName)}" />
                  <div class="form-grid">
                    <div class="field">
                      <label>日期</label>
                      <input data-field="date" type="date" value="${escapeAttr(draft.date)}" />
                    </div>
                    <div class="field">
                      <label>金额 RM</label>
                      <input data-field="amount" type="number" min="0" step="0.01" placeholder="0.00" value="${escapeAttr(
                        draft.amount
                      )}" />
                    </div>
                    <div class="field wide">
                      <label>项目</label>
                      <input data-field="item" type="text" value="${escapeAttr(draft.item)}" />
                    </div>
                    <div class="field">
                      <label>类型</label>
                      <select data-field="type">
                        ${["共同消费", "转账给 yifan", "衣服代付", "其他代付"]
                          .map(
                            (type) =>
                              `<option value="${escapeAttr(type)}" ${draft.type === type ? "selected" : ""}>${escapeHtml(
                                type
                              )}</option>`
                          )
                          .join("")}
                      </select>
                    </div>
                    <div class="field">
                      <label>分摊</label>
                      <select data-field="splitMode">
                        ${[
                          ["both", "我、cici、yifan 平分"],
                          ["cici", "我和 cici 平分"],
                          ["yifan", "我和 yifan 平分"],
                          ["ciciFull", "cici 全额"],
                          ["yifanFull", "yifan 全额"],
                          ["custom", "手动金额"],
                        ]
                          .map(
                            ([value, label]) =>
                              `<option value="${value}" ${draft.splitMode === value ? "selected" : ""}>${label}</option>`
                          )
                          .join("")}
                      </select>
                    </div>
                    <div class="field">
                      <label>cici 应还</label>
                      <input data-field="cici" type="number" min="0" step="0.01" value="${Number(draft.cici).toFixed(
                        2
                      )}" ${draft.splitMode === "custom" ? "" : "readonly"} />
                    </div>
                    <div class="field">
                      <label>yifan 应还</label>
                      <input data-field="yifan" type="number" min="0" step="0.01" value="${Number(draft.yifan).toFixed(
                        2
                      )}" ${draft.splitMode === "custom" ? "" : "readonly"} />
                    </div>
                    <div class="field wide">
                      <label>备注</label>
                      <input data-field="note" type="text" value="${escapeAttr(draft.note)}" />
                    </div>
                  </div>
                </div>
                <div class="pending-actions">
                  <span class="note">${
                    draft.status === "scanning"
                      ? "识别中..."
                      : draft.confidence === "high"
                      ? "已自动识别"
                      : draft.confidence === "medium"
                      ? "已识别金额"
                      : "等待识别"
                  }</span>
                  <button class="btn danger" type="button" data-action="remove-draft">移除</button>
                  <button class="btn primary" type="button" data-action="confirm-draft" ${
                    draft.status === "scanning" ? "disabled" : ""
                  }>确认入账</button>
                </div>
              </article>
            `
          )
          .join("");
      }

      function updateDraftFromControl(control) {
        const card = control.closest("[data-draft-id]");
        const draft = drafts.find((item) => item.id === card.dataset.draftId);
        if (!draft) return;
        const field = control.dataset.field;
        if (field === "amount" || field === "cici" || field === "yifan") {
          draft[field] = Number(control.value) || 0;
        } else {
          draft[field] = control.value;
        }
        if (field === "splitMode" && draft.splitMode === "yifanFull" && draft.type === "共同消费") {
          draft.type = "转账给 yifan";
        }
        if (field === "splitMode" && draft.splitMode !== "custom") updateDraftAmounts(draft);
        if (field === "amount" && draft.splitMode !== "custom") updateDraftAmounts(draft);
        refreshDraftCard(card, draft);
      }

      function refreshDraftCard(card, draft) {
        const ciciInput = card.querySelector('[data-field="cici"]');
        const yifanInput = card.querySelector('[data-field="yifan"]');
        const typeInput = card.querySelector('[data-field="type"]');
        ciciInput.value = Number(draft.cici).toFixed(2);
        yifanInput.value = Number(draft.yifan).toFixed(2);
        ciciInput.readOnly = draft.splitMode !== "custom";
        yifanInput.readOnly = draft.splitMode !== "custom";
        typeInput.value = draft.type;
      }

      function confirmDraft(id) {
        const draft = drafts.find((item) => item.id === id);
        if (!draft) return;
        const amount = Number(draft.amount) || 0;
        if (!draft.date || !draft.item.trim() || amount <= 0) {
          notify("请先补齐日期、项目和金额");
          return;
        }

        const entry = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          date: draft.date,
          item: draft.item.trim(),
          amount,
          people: peopleForDraft(draft),
          cici: Number(draft.cici) || 0,
          yifan: Number(draft.yifan) || 0,
          type: draft.type,
          note: draft.note.trim() || "网页入账",
          shots: [{ src: draft.src, label: draft.item.trim() }],
          source: "web-upload",
        };

        entries.push(entry);
        drafts = drafts.filter((item) => item.id !== id);
        saveStoredEntries();
        renderPending();
        renderGallery();
        render();
        notify("已入账并更新汇总");
      }

      function renderGallery() {
        const unique = [];
        const seen = new Set();
        entries.forEach((entry) => {
          entry.shots.forEach((shot) => {
            if (!seen.has(shot.src)) {
              seen.add(shot.src);
              unique.push(shot);
            }
          });
        });

        document.querySelector("#gallery").innerHTML = unique
          .map(
            (shot) => `
              <button class="thumb" type="button" data-src="${escapeAttr(shot.src)}" data-label="${escapeAttr(shot.label)}">
                <img src="${escapeAttr(shot.src)}" alt="${escapeAttr(shot.label)}" loading="lazy" />
                <span>${escapeHtml(shot.label)}</span>
              </button>
            `
          )
          .join("");
      }

      document.addEventListener("click", (event) => {
        const removeEntryButton = event.target.closest('[data-action="remove-entry"]');
        if (removeEntryButton) {
          event.preventDefault();
          event.stopPropagation();
          removeEntryById(removeEntryButton.dataset.entryId);
          return;
        }

        const button = event.target.closest("[data-src]");
        if (button) showImage(button.dataset.src, button.dataset.label);

        const confirmButton = event.target.closest('[data-action="confirm-draft"]');
        if (confirmButton) confirmDraft(confirmButton.closest("[data-draft-id]").dataset.draftId);

        const removeButton = event.target.closest('[data-action="remove-draft"]');
        if (removeButton) {
          const id = removeButton.closest("[data-draft-id]").dataset.draftId;
          drafts = drafts.filter((draft) => draft.id !== id);
          renderPending();
          notify("已移除待确认截图");
        }

      });

      pendingList.addEventListener("input", (event) => {
        if (event.target.matches("[data-field]")) updateDraftFromControl(event.target);
      });

      pendingList.addEventListener("change", (event) => {
        if (event.target.matches("[data-field]")) updateDraftFromControl(event.target);
      });

      uploadZone.addEventListener("click", () => receiptInput.click());
      receiptInput.addEventListener("change", () => {
        readFiles(receiptInput.files);
        receiptInput.value = "";
      });

      uploadZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        uploadZone.classList.add("dragging");
      });

      uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("dragging"));
      uploadZone.addEventListener("drop", (event) => {
        event.preventDefault();
        uploadZone.classList.remove("dragging");
        readFiles(event.dataTransfer.files);
      });

      document.addEventListener("paste", (event) => {
        const files = Array.from(event.clipboardData?.files || []);
        if (files.some((file) => file.type.startsWith("image/"))) readFiles(files);
      });

      document.querySelector("#closeDialog").addEventListener("click", () => imageDialog.close());
      imageDialog.addEventListener("click", (event) => {
        if (event.target === imageDialog) imageDialog.close();
      });

      [searchInput, dateFilter, personFilter, typeFilter].forEach((control) => {
        control.addEventListener("input", render);
        control.addEventListener("change", render);
      });

      document.querySelector("#resetBtn").addEventListener("click", () => {
        searchInput.value = "";
        dateFilter.value = "all";
        personFilter.value = "all";
        typeFilter.value = "all";
        render();
      });

      clearDraftsBtn.addEventListener("click", () => {
        drafts = [];
        renderPending();
        notify("待确认已清空");
      });

      exportBtn.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `kl-split-${todayIso()}.json`;
        link.click();
        URL.revokeObjectURL(url);
      });

      if (location.protocol === "file:") {
        setOcrHint(`建议用 ${OCR_PAGE_URL} 打开本页，自动识别更稳定`, true);
      } else if (!canUseLocalOcr()) {
        setOcrHint(canUseBrowserOcr() ? "线上版会在浏览器内自动识别截图" : "OCR 组件加载中，上传后会进入待确认");
      } else {
        setOcrHint("本机 OCR 已准备，上传后自动填入识别结果");
      }

      renderPending();
      renderGallery();
      render();
    </script>
  </body>
</html>
